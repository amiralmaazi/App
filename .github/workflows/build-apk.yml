name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Accept Pre-installed Android Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Create App, Set Custom Icon & Bundle Offline Libraries
        run: |
          npm install -g cordova
          cordova create app com.clinic.morbidity "MorbidityTracker"
          
          cp index.html app/www/index.html
          
          # تفعيل AndroidX وصلاحيات مشاركة الملفات في أندرويد 11-14
          sed -i 's|</widget>|    <preference name="AndroidXEnabled" value="true" />\n    <preference name="AndroidInsecureFileModeEnabled" value="true" />\n</widget>|g' app/config.xml

          # دمج الأيقونة المخصصة إذا كانت مرفوعة باسم icon.png
          if [ -f "icon.png" ]; then
            cp icon.png app/icon.png
            sed -i 's|</widget>|    <icon src="icon.png" />\n</widget>|g' app/config.xml
          fi

          mkdir -p app/www/lib
          curl -sL https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js -o app/www/lib/xlsx.full.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js -o app/www/lib/html2pdf.bundle.min.js

          cd app
          cordova plugin add cordova-plugin-x-socialsharing
          cordova plugin add cordova-plugin-printer

      - name: 6. Build Android APK
        run: |
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../MorbidityTracker.apk

      - name: 7. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: MorbidityTracker-APK
          path: MorbidityTracker.apk
