name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Accept Pre-installed Android Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Create App & Bundle Libraries
        run: |
          npm install -g cordova
          cordova create app com.clinic.morbidity "MorbidityTracker"
          
          if [ -f "index.html" ]; then
            cp index.html app/www/index.html
          else
            FIRST_HTML=$(find . -maxdepth 2 -name "*.html" | head -n 1)
            cp "$FIRST_HTML" app/www/index.html
          fi

          mkdir -p app/www/lib
          curl -sL https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js -o app/www/lib/xlsx.full.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js -o app/www/lib/html2pdf.bundle.min.js
          sed -i 's|https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js|lib/xlsx.full.min.js|g' app/www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js|lib/html2pdf.bundle.min.js|g' app/www/index.html

      - name: 6. Build Android APK
        run: |
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../MorbidityTracker.apk

      - name: 7. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: MorbidityTracker-APK
          path: MorbidityTracker.apk
