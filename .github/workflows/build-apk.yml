name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Gradle & Cordova
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          npm install -g cordova

      - name: 6. Create Cordova Project & Bundle Offline Libraries
        run: |
          cordova create app com.clinic.morbidity "MorbidityTracker"
          cp index.html app/www/index.html
          mkdir -p app/www/lib
          curl -L https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js -o app/www/lib/xlsx.full.min.js
          curl -L https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js -o app/www/lib/html2pdf.bundle.min.js
          sed -i 's|https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js|lib/xlsx.full.min.js|g' app/www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js|lib/html2pdf.bundle.min.js|g' app/www/index.html

      - name: 7. Build APK Package
        run: |
          cd app
          cordova platform add android
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../MorbidityTracker.apk

      - name: 8. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: MorbidityTracker-APK
          path: MorbidityTracker.apk
